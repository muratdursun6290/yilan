<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15142e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Yılan</title>
<style>
:root{
  --bg:#eceaf8;--board:#ffffff;--grid:#ebe8f7;--ink:#1d1a3b;--muted:#6a6794;
  --snake:#0a8fb5;--head:#066a88;--food:#e08a00;--panel:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15142e;--board:#1e1d42;--grid:#262552;--ink:#eeecff;--muted:#9a97c8;
    --snake:#4cc9f0;--head:#9be7ff;--food:#ffb703;--panel:#262552;
  }
}
:root[data-theme="dark"]{
  --bg:#15142e;--board:#1e1d42;--grid:#262552;--ink:#eeecff;--muted:#9a97c8;
  --snake:#4cc9f0;--head:#9be7ff;--food:#ffb703;--panel:#262552;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;width:var(--w,320px)}
.stat{font-size:15px;color:var(--muted)}
.stat b{font-size:26px;color:var(--ink);margin-left:6px;font-variant-numeric:tabular-nums}
.wrap{position:relative}
canvas{display:block;border-radius:14px;background:var(--board)}
.ov{
  position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
}
.ov.hide{display:none}
.ov h1{margin:0;font-size:40px;letter-spacing:.5px}
.ov p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:260px}
button{
  font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 26px;
  background:var(--snake);color:#fff;font-size:17px;cursor:pointer;
}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ghost{background:var(--panel);color:var(--ink);font-size:14px;padding:9px 14px;font-weight:600}
.row{display:flex;gap:10px}
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="stat">Skor<b id="sc">0</b></div>
  <div class="stat">En iyi<b id="best">0</b></div>
</div>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="ov">
    <h1 id="t">Yılan</h1>
    <p id="m">Yemi ye, uza, duvara ya da kendine çarpma. Yönü değiştirmek için ekranda parmağını kaydır.</p>
    <button id="go">Başla</button>
  </div>
</div>
<div class="row">
  <button class="ghost" id="wall">Duvarlar: ölümcül</button>
  <button class="ghost" id="pause">Duraklat</button>
</div>

<script>
(function(){
  var N=20,S,cell,cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var snake,dir,q,food,score,best=0,running=false,over=false,wrap=false,timer;
  var $=function(i){return document.getElementById(i)};

  try{best=parseInt(localStorage.getItem('yilan-best'))||0}catch(e){}
  $('best').textContent=best;

  function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

  function size(){
    var w=Math.min(innerWidth-24,innerHeight-230,560);
    S=Math.max(200,Math.floor(w/N)*N);cell=S/N;
    var d=window.devicePixelRatio||1;
    cv.width=S*d;cv.height=S*d;cv.style.width=S+'px';cv.style.height=S+'px';
    ctx.setTransform(d,0,0,d,0,0);
    $('bar').style.setProperty('--w',S+'px');
    if(snake)draw();
  }

  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0};q=[];score=0;over=false;
    $('sc').textContent=0;placeFood();
  }

  function placeFood(){
    var free=[];
    for(var x=0;x<N;x++)for(var y=0;y<N;y++){
      if(!snake.some(function(s){return s.x===x&&s.y===y}))free.push({x:x,y:y});
    }
    food=free.length?free[Math.floor(Math.random()*free.length)]:null;
  }

  function step(){
    if(q.length)dir=q.shift();
    var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
    else if(h.x<0||h.y<0||h.x>=N||h.y>=N)return end();
    var eat=food&&h.x===food.x&&h.y===food.y;
    var body=eat?snake:snake.slice(0,-1);
    if(body.some(function(s){return s.x===h.x&&s.y===h.y}))return end();
    snake.unshift(h);
    if(eat){
      score++;$('sc').textContent=score;placeFood();
      if(navigator.vibrate)navigator.vibrate(20);
      if(!food)return end(true);
    }else snake.pop();
  }

  function loop(){
    if(!running)return;
    step();draw();
    if(running)timer=setTimeout(loop,Math.max(70,150-score*3));
  }

  function end(won){
    running=false;over=true;clearTimeout(timer);
    if(score>best){
      best=score;$('best').textContent=best;
      try{localStorage.setItem('yilan-best',best)}catch(e){}
    }
    if(navigator.vibrate)navigator.vibrate(won?[30,40,30]:120);
    show(won?'Kazandın!':'Oyun bitti','Skorun: '+score+(score&&score===best?' — yeni rekor!':''),'Tekrar oyna');
  }

  function show(t,m,b){
    $('t').textContent=t;$('m').textContent=m;$('go').textContent=b;
    $('ov').classList.remove('hide');
    $('pause').textContent='Duraklat';
  }

  function start(){
    if(over||!snake)reset();
    $('ov').classList.add('hide');
    running=true;clearTimeout(timer);draw();
    timer=setTimeout(loop,Math.max(70,150-score*3));
  }

  function pause(){
    if(!running)return;
    running=false;clearTimeout(timer);
    show('Duraklatıldı','Devam etmek için dokun.','Devam et');
  }

  function turn(dx,dy){
    if(!running){if(over)return;start()}
    var last=q.length?q[q.length-1]:dir;
    if((dx===last.x&&dy===last.y)||(dx===-last.x&&dy===-last.y))return;
    if(q.length<2)q.push({x:dx,y:dy});
  }

  function rr(x,y,w,h,r){
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
    ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,S,S);
    ctx.fillStyle=col('--board');ctx.fillRect(0,0,S,S);
    ctx.fillStyle=col('--grid');
    for(var x=0;x<N;x++)for(var y=0;y<N;y++){
      if((x+y)%2===0)ctx.fillRect(x*cell,y*cell,cell,cell);
    }
    if(food){
      ctx.fillStyle=col('--food');
      ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.36,0,7);ctx.fill();
    }
    if(!snake)return;
    var p=cell*.08;
    for(var i=snake.length-1;i>=0;i--){
      var s=snake[i];
      ctx.fillStyle=i===0?col('--head'):col('--snake');
      rr(s.x*cell+p,s.y*cell+p,cell-2*p,cell-2*p,cell*.32);
    }
    var h=snake[0],ex=dir.x,ey=dir.y,cx=(h.x+.5)*cell,cy=(h.y+.5)*cell,o=cell*.2;
    ctx.fillStyle=col('--board');
    [-1,1].forEach(function(k){
      var px=cx+ex*o-ey*o*k,py=cy+ey*o+ex*o*k;
      ctx.beginPath();ctx.arc(px,py,cell*.09,0,7);ctx.fill();
    });
  }

  // Kontroller
  var sx,sy;
  document.addEventListener('touchstart',function(e){
    if(e.target.tagName==='BUTTON')return;
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});
  document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('touchend',function(e){
    if(e.target.tagName==='BUTTON'||sx==null)return;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  });
  document.addEventListener('keydown',function(e){
    var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();turn(m[0],m[1])}
    else if(e.key===' '){running?pause():start()}
  });
  $('go').addEventListener('click',start);
  $('pause').addEventListener('click',function(){running?pause():(snake&&!over?start():0)});
  $('wall').addEventListener('click',function(){
    wrap=!wrap;this.textContent='Duvarlar: '+(wrap?'geçilir':'ölümcül');
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden)pause()});
  addEventListener('resize',size);

  reset();size();
})();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
